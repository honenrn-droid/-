name: Build TBN Jeju Radio APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q TBN_Jeju_Radio_Online_Build.zip

      - name: Build APK
        run: |
          cd TBN_Jeju_Radio_Android
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TBN-Jeju-Radio-APK
          path: TBN_Jeju_Radio_Android/app/build/outputs/apk/debug/app-debug.apk
